[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "seshquic"
version = "1.9.0"
description = "QUIC for Python, built on libquic"
readme = "python/README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Internet",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
wheel.packages = ["python/seshquic"]
cmake.version = ">=3.18"
cmake.define.LIBQUIC_BUILD_PYTHON = "ON"
cmake.define.LIBQUIC_BUILD_TESTS = "OFF"
cmake.define.LIBQUIC_BUILD_SPEEDTEST = "OFF"
cmake.define.LIBQUIC_BUILD_BTREQTEST = "OFF"
cmake.define.LIBQUIC_INSTALL = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
